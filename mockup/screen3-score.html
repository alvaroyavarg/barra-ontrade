<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
.vhead{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.vhead .ttl{flex:1}.vhead .ttl .c{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px}
.vhead .ttl .s{font-size:12px;color:var(--muted);margin-top:1px}
.scard{padding:18px}
.ptitle{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);margin:0 4px 10px}
</style></head>
<body><div class="app" style="padding-bottom:160px">

  <div class="vhead">
    <button class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="ttl"><div class="c">Siete Negronis <span class="badge aacc">AACC</span></div><div class="s">Visita registrada · hoy 15:42</div></div>
  </div>

  <div class="scroll list">

    <div class="card scard">
      <div class="numwrap">
        <div>
          <div class="bigscore"><span class="v tx-red">58</span><span class="max">/100</span><span class="dot red" style="width:12px;height:12px;align-self:center"></span></div>
          <div class="sm muted" style="margin-top:4px">Score general · bajo la meta (70)</div>
        </div>
      </div>
      <div class="alert" style="margin-top:16px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
        Piso AACC incumplido · 2 ítems obligatorios sin cumplir
      </div>
    </div>

    <div>
      <div class="ptitle">Por pilar</div>
      <div class="card scard" style="padding:8px 16px">
        <div class="brow"><span class="pn">Staff</span><div class="progress green" style="flex:1"><i style="width:80%"></i></div><span class="pv tx-green">80</span></div>
        <hr class="sep">
        <div class="brow"><span class="pn">Menú</span><div class="progress red" style="flex:1"><i style="width:42%"></i></div><span class="pv tx-red">42</span></div>
        <hr class="sep">
        <div class="brow"><span class="pn">Activación</span><div class="progress amber" style="flex:1"><i style="width:60%"></i></div><span class="pv tx-amber">60</span></div>
      </div>
    </div>

    <div>
      <div class="ptitle">Brechas vs meta</div>
      <div class="card scard" style="padding:4px 16px">
        <div class="gap"><span class="gl">Share of menu</span><span class="gv tx-red">45% · meta 60%</span></div>
        <div class="gap"><span class="gl">Primera posición · Top 3</span><span class="gv tx-red">No</span></div>
        <div class="gap"><span class="gl">SKU mínimos en carta</span><span class="gv tx-amber">5 de 7</span></div>
      </div>
    </div>

  </div>

  <div class="bottom">
    <div class="cta-wrap" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn primary">Finalizar visita</button>
      <button class="btn ghost">Ver detalle por ítem</button>
    </div>
  </div>

</div></body></html>
